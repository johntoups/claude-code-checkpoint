<script>
(function () {
  function openTarget(hash) {
    if (!hash || hash.indexOf('#a-') !== 0) return;
    var d = document.getElementById(hash.slice(1));
    if (d && d.tagName === 'DETAILS') { d.open = true; d.scrollIntoView({ block: 'start' }); }
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#a-"]');
    if (a) { e.preventDefault(); history.replaceState(null, '', a.getAttribute('href')); openTarget(a.getAttribute('href')); }
  });
  openTarget(location.hash);
})();
</script>
